<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>手机端 · 华东弹簧演示</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/components.css">
<style>
  /* 窄屏（真手机）全屏；宽屏画一台手机外框，框里自己滚动 */
  html, body { height: 100%; }
  body.sc { overflow: hidden; }
  .stage { height: 100%; }
  .device { position: relative; display: flex; flex-direction: column; width: 100%; height: 100%; background: var(--bg); overflow: hidden; }
  .statusbar { display: none; }
  .caption { display: none; }
  @media (min-width: 640px) and (min-height: 640px) {
    .stage { display: flex; align-items: center; justify-content: center; gap: var(--sp-6); padding: var(--sp-5);
      background: radial-gradient(circle at 30% 20%, var(--primary-soft), transparent 60%), var(--bg); }
    .device { width: 390px; height: min(844px, calc(100vh - 48px)); flex: none; border-radius: 46px;
      border: 11px solid #0c111d; box-shadow: 0 0 0 2px #2a3348, 0 24px 60px rgba(8, 14, 30, .35); }
    .statusbar { display: flex; align-items: center; justify-content: space-between; flex: none; height: 34px; padding: 0 26px 0 30px;
      font-size: var(--fs-sm); font-weight: 600; background: var(--surface); }
    .statusbar .notch { width: 96px; height: 24px; border-radius: 0 0 14px 14px; background: #0c111d; margin-top: -10px; }
    .caption { display: block; max-width: 260px; color: var(--text-2); font-size: var(--fs-sm); }
    .caption h2 { color: var(--text); }
    .caption .sc-btn { margin-top: var(--sp-3); }
  }
  @media (min-width: 640px) and (min-height: 640px) and (max-width: 860px) { .caption { display: none; } }

  .m-head { display: flex; align-items: center; gap: var(--sp-2); flex: none; padding: var(--sp-2) var(--sp-4) var(--sp-3);
    background: var(--surface); border-bottom: 1px solid var(--border); }
  .m-head .t { min-width: 0; }
  .m-head .t b { display: block; font-size: var(--fs-lg); line-height: 1.3; }
  .m-head .t span { display: block; font-size: var(--fs-xs); color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .m-head .sc-spacer { flex: 1; }
  .icon-btn { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface-2);
    color: var(--text-2); font: inherit; font-size: var(--fs-lg); cursor: pointer; }
  .m-main { flex: 1; overflow-y: auto; overflow-x: hidden; padding: var(--sp-3) var(--sp-3) var(--sp-5); -webkit-overflow-scrolling: touch; }
  .view[hidden] { display: none; }
  .m-tabs { display: flex; flex: none; background: var(--surface); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); }
  .m-tabs button { flex: 1; border: 0; background: none; font: inherit; font-size: var(--fs-xs); color: var(--text-3); padding: 8px 0 10px; cursor: pointer; }
  .m-tabs button i { display: block; font-style: normal; font-size: 20px; line-height: 1.2; }
  .m-tabs button.active { color: var(--primary); font-weight: 600; }

  /* 卡片与列表 */
  .m-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow);
    padding: var(--sp-3); margin-bottom: var(--sp-3); }
  .m-card > h3 { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-md); margin: 0 0 var(--sp-2); }
  .m-card > h3 .n { margin-left: auto; font-weight: 400; color: var(--text-3); font-size: var(--fs-xs); }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-2); margin-bottom: var(--sp-3); }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--sp-2) var(--sp-3); min-width: 0; }
  .kpi .l { font-size: var(--fs-xs); color: var(--text-2); }
  .kpi .v { font-size: 22px; font-weight: 650; line-height: 1.25; }
  .kpi .v small { font-size: var(--fs-xs); font-weight: 500; color: var(--text-2); margin-left: 2px; }
  .kpi .d { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  [data-theme="dark"] .kpi .v { text-shadow: var(--glow); }
  .row { display: flex; align-items: center; gap: var(--sp-2); padding: 9px 0; border-bottom: 1px solid var(--border); cursor: pointer; min-width: 0; }
  .row:last-child { border-bottom: 0; }
  .row .main { flex: 1; min-width: 0; }
  .row .main b { display: block; font-weight: 600; font-size: var(--fs-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .main span { display: block; font-size: var(--fs-xs); color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .side { flex: none; text-align: right; font-size: var(--fs-xs); }
  .row .side .sc-num { display: block; font-size: var(--fs-sm); color: var(--text); }
  .row::after { content: "›"; color: var(--text-3); font-size: 18px; flex: none; }
  .row.static { cursor: default; } .row.static::after { content: none; }
  .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--st); }
  [data-theme="dark"] .dot { box-shadow: 0 0 8px var(--st); }
  .alert { display: flex; gap: var(--sp-2); align-items: flex-start; padding: 7px 0; border-bottom: 1px dashed var(--border); font-size: var(--fs-sm); }
  .alert:last-child { border-bottom: 0; }
  .alert .sc-badge { flex: none; }
  .link { color: var(--primary); cursor: pointer; }
  .meter { display: grid; grid-template-columns: 1fr 40px; gap: var(--sp-2); align-items: center; }
  .meter .sc-num { text-align: right; font-size: var(--fs-xs); }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-2); margin: var(--sp-2) 0 var(--sp-3); }
  .facts > div { background: var(--surface-2); border-radius: var(--radius-sm); padding: 6px 10px; min-width: 0; }
  .facts .k { font-size: 11px; color: var(--text-2); }
  .facts .v { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .days { display: grid; grid-template-columns: 42px 1fr 40px; gap: 6px var(--sp-2); align-items: center; font-size: var(--fs-xs); margin: var(--sp-2) 0; }
  .days .sc-num { text-align: right; }
  .seg { display: flex; background: var(--surface-2); border-radius: var(--radius-sm); padding: 3px; margin-bottom: var(--sp-3); }
  .seg button { flex: 1; border: 0; background: none; font: inherit; font-size: var(--fs-sm); padding: 5px 0; border-radius: 5px; color: var(--text-2); cursor: pointer; }
  .seg button.active { background: var(--surface); color: var(--primary); font-weight: 600; box-shadow: var(--shadow); }

  /* 表单 */
  .form label { display: block; font-size: var(--fs-xs); color: var(--text-2); margin-bottom: var(--sp-2); min-width: 0; }
  .form input, .form select { display: block; width: 100%; margin-top: 3px; font: inherit; font-size: 16px; color: var(--text);
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 7px 10px; min-width: 0; }
  .form input:focus, .form select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .form .row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--sp-2); }
  .result { border-top: 1px solid var(--border); margin-top: var(--sp-2); padding-top: var(--sp-2); }
  .verdict { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); font-size: var(--fs-md); margin: var(--sp-1) 0 var(--sp-2); }
  .btn-block { width: 100%; justify-content: center; padding: 10px 14px; font-size: var(--fs-md); }

  /* 底部弹层 */
  .scrim { position: absolute; inset: 0; background: rgba(8, 14, 30, .38); opacity: 0; pointer-events: none; transition: opacity var(--dur); z-index: 20; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 86%; z-index: 21; display: flex; flex-direction: column;
    background: var(--surface); border-radius: 18px 18px 0 0; box-shadow: 0 -8px 32px rgba(0, 0, 0, .22);
    transform: translateY(105%); transition: transform .24s ease; }
  .device.sheet-open .scrim { opacity: 1; pointer-events: auto; }
  .device.sheet-open .sheet { transform: none; }
  .sheet .grip { width: 38px; height: 4px; border-radius: 2px; background: var(--border); margin: 8px auto 0; flex: none; }
  .sheet-head { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-2) var(--sp-4); flex: none; }
  .sheet-head h2 { margin: 0; font-size: var(--fs-lg); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sheet-head .sc-spacer { flex: 1; }
  .sheet-body { overflow-y: auto; padding: 0 var(--sp-4) calc(var(--sp-5) + env(safe-area-inset-bottom)); }
  .sheet-body h3 { font-size: var(--fs-sm); margin: var(--sp-3) 0 var(--sp-1); color: var(--text-2); font-weight: 600; }

  /* 工人报工 */
  .me { display: flex; align-items: center; gap: var(--sp-3); }
  .avatar { flex: none; width: 44px; height: 44px; border-radius: 50%; background: var(--primary-soft); color: var(--primary);
    display: grid; place-items: center; font-weight: 700; }
  .today { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-2); margin-top: var(--sp-3); }
  .today > div { background: var(--surface-2); border-radius: var(--radius-sm); padding: var(--sp-2) var(--sp-3); }
  .today .l { font-size: var(--fs-xs); color: var(--text-2); }
  .today .v { font-size: 26px; font-weight: 650; line-height: 1.2; }
  .scan-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; width: 100%; height: 132px;
    border: 0; border-radius: var(--radius-lg); background: var(--primary); color: var(--on-primary); font: inherit; font-size: var(--fs-xl);
    font-weight: 650; cursor: pointer; box-shadow: 0 8px 24px color-mix(in srgb, var(--primary) 35%, transparent); margin-bottom: var(--sp-3); }
  .scan-btn .qr { width: 44px; height: 44px; border: 3px solid currentColor; border-radius: 8px; position: relative; }
  .scan-btn .qr::before, .scan-btn .qr::after { content: ""; position: absolute; width: 12px; height: 12px; background: currentColor; border-radius: 2px; }
  .scan-btn .qr::before { left: 5px; top: 5px; box-shadow: 18px 18px 0 currentColor; } .scan-btn .qr::after { right: 5px; top: 5px; }
  .banner { display: flex; gap: var(--sp-2); align-items: flex-start; border-radius: var(--radius-sm); padding: var(--sp-2) var(--sp-3); margin-bottom: var(--sp-3);
    font-size: var(--fs-sm); color: var(--text); background: color-mix(in srgb, var(--st) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--st) 40%, transparent); }
  .stepper { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; gap: 6px; margin-top: 3px; }
  .stepper button { font: inherit; font-size: 20px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); border-radius: var(--radius-sm); cursor: pointer; }
  .stepper input { margin-top: 0; text-align: center; font-family: var(--font-mono); font-size: 18px; }
  .done-mark { width: 64px; height: 64px; border-radius: 50%; margin: var(--sp-3) auto var(--sp-2); display: grid; place-items: center;
    background: color-mix(in srgb, var(--st-run) 16%, transparent); color: var(--st-run); font-size: 34px; font-weight: 700; }
  .center { text-align: center; }
  .scan { position: absolute; inset: 0; z-index: 30; background: #05080f; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--sp-4); }
  .scan[hidden] { display: none; }
  .finder { position: relative; width: 220px; height: 220px; border-radius: 16px;
    background: linear-gradient(135deg, #1c2333, #10151f); box-shadow: 0 0 0 9999px rgba(0, 0, 0, .35); overflow: hidden; }
  .finder::before { content: ""; position: absolute; inset: 0; border: 3px solid transparent; border-radius: 16px;
    background: linear-gradient(#fff, #fff) top left / 28px 3px no-repeat, linear-gradient(#fff, #fff) top left / 3px 28px no-repeat,
      linear-gradient(#fff, #fff) top right / 28px 3px no-repeat, linear-gradient(#fff, #fff) top right / 3px 28px no-repeat,
      linear-gradient(#fff, #fff) bottom left / 28px 3px no-repeat, linear-gradient(#fff, #fff) bottom left / 3px 28px no-repeat,
      linear-gradient(#fff, #fff) bottom right / 28px 3px no-repeat, linear-gradient(#fff, #fff) bottom right / 3px 28px no-repeat; }
  .finder .card-img { position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; transform: translate(-50%, -50%) rotate(-4deg);
    background: repeating-conic-gradient(#e7edf8 0 25%, #10151f 0 50%) 0 0 / 20px 20px; border: 8px solid #e7edf8; border-radius: 4px; opacity: .85; }
  .finder .line { position: absolute; left: 10px; right: 10px; height: 2px; background: #3dd3f0; box-shadow: 0 0 12px #3dd3f0; animation: sweep 1.1s ease-in-out infinite alternate; }
  @keyframes sweep { from { top: 14px; } to { top: 204px; } }
  .scan .tip { font-size: var(--fs-sm); color: #c9d3e6; }
</style>
</head>
<body class="sc">
<div class="stage">
  <div class="caption">
    <h2>手机端示意</h2>
    <p>驾驶舱和销售工作台的手机版，外加工人扫码报工。底部三个页签切换角色，点任一行从下方弹出详情。</p>
    <p>数字与电脑上的驾驶舱、销售工作台同一份数据，对得上。</p>
    <a class="sc-btn" href="../cockpit/index.html">回驾驶舱</a> <a class="sc-btn" href="../sales/index.html">回销售工作台</a> <button class="sc-btn" onclick="askAi()">问分析助手</button>
  </div>

  <div class="device" id="device">
    <div class="statusbar"><span class="sc-num" id="sb-clock"></span><span class="notch"></span><span class="sc-num">5G ▮▮▮ 86%</span></div>
    <header class="m-head">
      <div class="t"><b id="h-title"></b><span id="h-sub"></span></div>
      <span class="sc-spacer"></span>
      <button class="icon-btn" title="问分析助手" onclick="askAi()" style="font-size: var(--fs-sm)">问</button>
      <button class="icon-btn" title="切换深浅" onclick="SC.toggleTheme()">◐</button>
    </header>

    <main class="m-main" id="main">
      <!-- 生产 -->
      <section class="view" id="v-production">
        <div class="kpis" id="p-kpis"></div>
        <div class="m-card"><h3>预警<span class="n" id="p-alert-n"></span></h3><div id="p-alerts"></div></div>
        <div class="m-card"><h3>工位<span class="n">未来 6 个工作日负荷</span></h3><div id="p-ws"></div></div>
        <div class="m-card"><h3>交期风险单<span class="n" id="p-risk-n"></span></h3><div id="p-risk"></div></div>
      </section>

      <!-- 销售 -->
      <section class="view" id="v-sales" hidden>
        <div class="kpis" id="s-kpis"></div>
        <div class="m-card"><h3>在谈商机<span class="n">点开看能不能接</span></h3><div id="s-deals"></div></div>
        <div class="m-card" id="quote-card"><h3>报价试算<span class="n">改数字当场重算</span></h3>
          <div class="form">
            <label>客户<select id="q-customer"></select></label>
            <label>产品<select id="q-product"></select></label>
            <div class="row2"><label>数量（支）<input id="q-qty" type="number" min="1000" step="1000"></label>
              <label>客户要货日<input id="q-date" type="date"></label></div>
            <label>单价（元／支，未税）<input id="q-price" type="number" min="0" step="0.01"></label>
          </div>
          <div class="result" id="q-result"></div>
        </div>
        <div class="m-card"><h3>应收与逾期<span class="n" id="s-ar-n"></span></h3><div id="s-ar"></div></div>
      </section>

      <!-- 工人报工 -->
      <section class="view" id="v-worker" hidden>
        <div class="m-card">
          <div class="me"><div class="avatar" id="w-avatar"></div>
            <div class="main" style="flex: 1; min-width: 0"><b id="w-name"></b><div class="sc-faint" id="w-ws"></div></div>
            <span id="w-badge"></span></div>
          <div class="today"><div><div class="l">今日良品</div><div class="v sc-num" id="w-good"></div></div>
            <div><div class="l">今日计件</div><div class="v sc-num" id="w-pay"></div></div></div>
        </div>
        <div id="w-banner"></div>
        <button class="scan-btn" onclick="startScan()"><span class="qr"></span>扫码报工</button>
        <div class="m-card"><h3>今日报工记录</h3><div id="w-log"></div></div>
        <div class="m-card form"><label>换个工人看（演示用）<select id="w-pick"></select></label></div>
      </section>
    </main>

    <nav class="m-tabs" id="tabs">
      <button data-v="production"><i>▦</i>生产</button>
      <button data-v="sales"><i>¥</i>销售</button>
      <button data-v="worker"><i>⌗</i>报工</button>
    </nav>

    <div class="scrim" onclick="closeSheet()"></div>
    <div class="sheet" aria-hidden="true">
      <div class="grip"></div>
      <div class="sheet-head"><h2 id="sh-title"></h2><span id="sh-badge"></span><span class="sc-spacer"></span><button class="sc-btn ghost" onclick="closeSheet()">关闭</button></div>
      <div class="sheet-body" id="sh-body"></div>
    </div>
    <div class="scan" id="scan" hidden>
      <div class="finder"><div class="card-img"></div><div class="line"></div></div>
      <div class="tip">对准工序卡上的二维码</div>
      <button class="sc-btn" onclick="cancelScan()">取消</button>
    </div>
  </div>
</div>

<script src="../shared/data.js"></script>
<script src="../shared/theme.js"></script>
<script>
const d = SC_DATA, k = d.kpi, $ = (id) => document.getElementById(id);
const P = d.get.product, WS = d.get.workstation, C = d.get.customer, SO = d.get.salesOrder;
const badge = (st, text) => `<span class="sc-badge ${st}">${text}</span>`;
const num = (v) => Number(v).toLocaleString("zh-CN");
const hours = (m) => (m / 60).toFixed(m < 600 ? 1 : 0) + " 小时";
const riskBadge = { late: badge("alarm", "延误"), tight: badge("wait", "偏紧"), ok: badge("run", "正常") };
const ctpBadge = (c) => c.slackDays < 0 ? badge("alarm", "晚 " + -c.slackDays + " 天") : c.slackDays === 0 ? badge("wait", "刚好赶上") : badge("run", "能接");
const stageBadge = { Qualification: "idle", "Demo/Making": "idle", "Proposal/Quotation": "wait", Negotiation: "over", "Ready to Close": "run", Won: "run", Lost: "down" };
const loadSt = (w) => w.load > 1 ? "over" : w.load > 0.85 ? "wait" : "run";
const meter = (v, st) => `<div class="meter"><div class="sc-bar ${st}"><i style="--v: ${Math.min(v, 1) * 100}%"></i></div><span class="sc-num">${Math.round(v * 100)}%</span></div>`;
const woById = Object.fromEntries(d.workOrders.map((w) => [w.id, w]));
const kpiTile = ([l, v, u, delta, click]) => `<div class="kpi"${click ? ` onclick="${click}" style="cursor:pointer"` : ""}><div class="l">${l}</div>
  <div class="v sc-num">${v}<small>${u || ""}</small></div><div class="d">${delta}</div></div>`;
const facts = (list) => `<div class="facts">${list.map(([kk, v]) => `<div><div class="k">${kk}</div><div class="v">${v}</div></div>`).join("")}</div>`;
$("sb-clock").textContent = d.nowClock;

// ---------- 页签 ----------
const heads = {
  production: [d.roles.production.title, `${d.company.name} · 今天 ${d.today} ${d.nowClock}`],
  sales: [d.roles.sales.title, `${d.company.name} · 今天 ${d.today} ${d.nowClock}`],
};
function show(v) {
  ["production", "sales", "worker"].forEach((x) => { $("v-" + x).hidden = x !== v; });
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("active", b.dataset.v === v));
  if (v === "worker") renderWorker(); else { $("h-title").textContent = heads[v][0]; $("h-sub").textContent = heads[v][1]; }
  $("main").scrollTop = 0; closeSheet();
}
document.querySelectorAll("#tabs button").forEach((b) => { b.onclick = () => show(b.dataset.v); });
// 跳分析助手：销售页签带销售的问题，生产和报工带生产的问题
function askAi() {
  const v = document.querySelector("#tabs button.active").dataset.v;
  location.href = "../ai/index.html?role=" + (v === "sales" ? "sales" : "production") + "&theme=" + SC.theme;
}

// ---------- 底部弹层 ----------
function openSheet(title, badgeHtml, body) {
  $("sh-title").textContent = title; $("sh-badge").innerHTML = badgeHtml || ""; $("sh-body").innerHTML = body; $("sh-body").scrollTop = 0;
  $("device").classList.add("sheet-open"); document.querySelector(".sheet").setAttribute("aria-hidden", "false");
}
function closeSheet() { $("device").classList.remove("sheet-open"); document.querySelector(".sheet").setAttribute("aria-hidden", "true"); }
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { cancelScan(); closeSheet(); } });

// ==================== 生产 ====================
const last = d.monthly[d.monthly.length - 1], prev = d.monthly[d.monthly.length - 2], mb = k.marginBridge;
const busiest = d.workstations.reduce((a, b) => (b.load > a.load ? b : a)), defDelta = last.defectRate - prev.defectRate;
$("p-kpis").innerHTML = [
  ["在制工单", k.wipOrders, "张", `<span class="sc-muted">${k.wipByOp.map((x) => x.op + x.count).join(" ")}</span>`],

function nowText() { const m = 30 + clockMin; return `${String(10 + Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`; }

function startScan() {
  $("scan").hidden = false;
  scanTimer = setTimeout(() => { $("scan").hidden = true; openCard(); }, 1400);
}
function cancelScan() { clearTimeout(scanTimer); $("scan").hidden = true; }
function openCard() {
  const w = d.get.worker(me), c = w.card;
  if (!c) {
    openSheet(w.workstation, badge(w.status, d.statusText[w.status]),
      `<p>扫到的是 ${w.workstation} 的设备码，但这台设备此刻没有开工的工序卡。</p>` +
      (w.note ? `<div class="banner ${w.status}"><span class="dot ${w.status}" style="margin-top:5px"></span><span>${w.note}</span></div>` : "") +
      `<button class="sc-btn btn-block" onclick="closeSheet()">知道了</button>`);
    return;
  }
  const lg = logs[me], r0 = d.report(me, 0, 0, lg.good);
  openSheet(c.id, riskBadge[c.risk],
    facts([["工单", c.workOrder.slice(-5) + " · " + c.customer], ["产品", P(c.product).name], ["本道工序", `${c.op} → 下道 ${c.next}`], ["交期", c.delivery]]) +
    `<h3>本道已完成 ${num(r0.cardGood)} 支，还应产出 ${num(r0.remainAfter)} 支</h3>${meter(r0.cardDone, "run")}` +
    `<div class="form" style="margin-top: var(--sp-3)">
      <label>本次良品（支）<div class="stepper"><button onclick="step('rp-good', -100)">−</button><input id="rp-good" type="number" min="0" step="100" value="500"><button onclick="step('rp-good', 100)">＋</button></div></label>
      <label>本次不良（支）<div class="stepper"><button onclick="step('rp-bad', -1)">−</button><input id="rp-bad" type="number" min="0" step="1" value="5"><button onclick="step('rp-bad', 1)">＋</button></div></label>
    </div><div id="rp-preview"></div>
    <button class="sc-btn primary btn-block" style="margin-top: var(--sp-3)" onclick="submitReport()">提交报工</button>`);
  ["rp-good", "rp-bad"].forEach((id) => { $(id).oninput = preview; });
  preview();
}
function step(id, delta) { $(id).value = Math.max(0, (+$(id).value || 0) + delta); preview(); }
function readInputs() { return [Math.max(0, Math.round(+$("rp-good").value || 0)), Math.max(0, Math.round(+$("rp-bad").value || 0))]; }
function preview() {
  const [good, bad] = readInputs(), r = d.report(me, good, bad, logs[me].good);
  $("rp-preview").innerHTML = facts([["本次计件", `<span class="sc-up">+¥${r.pay.toFixed(1)}</span>`], ["不良率", (r.badRate * 100).toFixed(1) + "%"]]) +
    r.warnings.map((w) => `<div class="alert">${badge(w.level, "提醒")}<span>${w.text}</span></div>`).join("");
}
function submitReport() {
  const [good, bad] = readInputs(); if (!good && !bad) return;
  const lg = logs[me], r = d.report(me, good, bad, lg.good), c = d.get.worker(me).card;
  clockMin += 3 + lg.list.length * 2;
  lg.list.push({ t: nowText(), op: c.op, good, bad, pay: r.pay }); lg.good += good;
  renderWorker();
  openSheet("已报工", badge("run", "已提交"),
    `<div class="done-mark">✓</div><p class="center" style="margin:0">${c.id} · ${c.op}　良品 <b class="sc-num">${num(good)}</b> 支，不良 <b class="sc-num">${bad}</b> 支</p>` +
    facts([["今日良品", num(r.todayGood) + " 支"], ["今日计件", "¥" + r.todayPay.toFixed(1)], ["本道完成", Math.round(r.cardDone * 100) + "%"], ["本次计件", "+¥" + r.pay.toFixed(1)]]) +
    r.warnings.map((w) => `<div class="alert">${badge(w.level, "提醒")}<span>${w.text}</span></div>`).join("") +
    `<p class="sc-faint">工序卡已提交，下道「${c.next}」的数量随之对齐；计件进月底计件汇总单。</p>
    <button class="sc-btn btn-block" onclick="closeSheet()">完成</button>`);
}

// 地址带 ?role=production|sales|worker 直接打开某个页签
const qRole = new URLSearchParams(location.search).get("role");
show(["production", "sales", "worker"].includes(qRole) ? qRole : "production");
</script>
</body>
</html>
