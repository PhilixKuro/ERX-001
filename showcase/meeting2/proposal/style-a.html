<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>样式 A · 每一笔收入怎么分</title>
<style>
  /* 样式 A：沿用讲稿 v8 的贴纸大画布风（P1-S10 R03 第 2 步样页）。只有浅色。
     三方配色经 dataviz 校验器（--pairs all，白底）全过：#1F9E89 / #2F6DB5 / #FF5A36。 */
  :root {
    --bg: #E9EEF2; --panel: #F6F8FA; --ink: #24313F; --ink2: #5A6B7D; --s2: #7189A3; --s3: #9DB0C3; --hair: #DCE3EA;
    --acc: #FF5A36; --acc-t: #E2401C;
    --p0: #1F9E89; --p1: #2F6DB5; --p2: #FF5A36;          /* 数字化合作公司 / 技术方 / 介绍人 */
    --p0-ink: #1c1b1a; --p1-ink: #ffffff; --p2-ink: #1c1b1a; /* 块内文字按底色亮度取黑或白 */
    --f-cn: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
    --f-num: "Bahnschrift", "DIN Alternate", "Helvetica Neue", Arial, "Microsoft YaHei", "PingFang SC", sans-serif;
    color-scheme: light;
  }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; color: var(--ink); font-family: var(--f-cn);
    background: var(--bg) radial-gradient(circle, #D2DAE2 2.2px, transparent 2.8px) 0 0 / 60px 60px; }
  #slide { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; transform-origin: 0 0;
    background: var(--panel); border-radius: 44px; box-shadow: 0 2px 0 rgba(36,49,63,.05), 0 50px 90px -46px rgba(36,49,63,.4); }
  #slide > * { position: absolute; }
  .kick { left: 96px; top: 78px; font-size: 22px; font-weight: 700; letter-spacing: .16em; color: var(--ink2); display: flex; align-items: center; gap: 14px; }
  .kick::before { content: ""; width: 38px; height: 9px; border-radius: 5px; background: var(--acc); }
  .no { right: 96px; top: 74px; font: 700 26px var(--f-num); color: var(--s3); letter-spacing: .12em; }
  h1 { left: 96px; top: 118px; margin: 0; font-size: 60px; font-weight: 700; line-height: 1.2; white-space: nowrap; }
  .sub { left: 96px; top: 206px; margin: 0; font-size: 26px; line-height: 1.6; color: var(--ink2); }
  em.mk { font-style: normal; color: var(--ink); font-weight: 700; background: linear-gradient(transparent 58%, rgba(255,90,54,.34) 58%); padding: 0 .06em; }

  .sticker { right: 110px; top: 110px; transform: rotate(8deg); }

  .card { background: #fff; border-radius: 24px; box-sizing: border-box; padding: 30px 36px;
    box-shadow: 0 2px 0 rgba(36,49,63,.06), 0 18px 34px -18px rgba(36,49,63,.32); }
  .chartcard { left: 96px; top: 282px; width: 1408px; height: 404px; }
  .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
  .legend { display: flex; gap: 30px; font-size: 19px; color: var(--ink2); }
  .legend i { display: inline-block; width: 22px; height: 14px; border-radius: 3px; margin-right: 8px; vertical-align: -1px; }
  .tbtn { font: 700 17px var(--f-cn); color: var(--ink2); background: none; border: 2px solid var(--hair); border-radius: 999px; padding: 6px 18px; cursor: pointer; }
  .tbtn:hover, .tbtn:focus-visible { border-color: var(--s2); color: var(--ink); outline: none; }
  .grp { font-size: 22px; font-weight: 700; margin: 0 0 10px; }
  .grp + .row { margin-top: 0; }
  .row { display: grid; grid-template-columns: 200px 1fr; align-items: center; gap: 20px; margin-bottom: 14px; }
  .row .who { font-size: 19px; color: var(--ink2); white-space: nowrap; }
  .gsp { height: 18px; }

  .bar { display: flex; gap: 2px; height: 28px; }
  .seg { flex: var(--v) 0 0; width: 0; border-radius: 4px; display: flex; align-items: center; padding-left: 10px; box-sizing: border-box;
    font: 700 16px var(--f-num); white-space: nowrap; cursor: default; outline-offset: 3px; }
  .seg:focus-visible { outline: 3px solid var(--ink); }
  .seg.p0 { background: var(--p0); color: var(--p0-ink); }
  .seg.p1 { background: var(--p1); color: var(--p1-ink); }
  .seg.p2 { background: var(--p2); color: var(--p2-ink); }

  table { width: 100%; border-collapse: collapse; font-size: 19px; }
  th, td { padding: 9px 10px; border-top: 1px solid var(--hair); text-align: left; }
  th { font-size: 16px; color: var(--ink2); font-weight: 700; }
  td.r, th.r { text-align: right; font-family: var(--f-num); font-variant-numeric: tabular-nums; }

  .mini { top: 710px; width: 688px; height: 112px; padding: 22px 30px; }
  .mini.m1 { left: 96px; } .mini.m2 { left: 816px; }
  .mini h3 { margin: 0 0 6px; font-size: 22px; }
  .mini p { margin: 0; font-size: 17px; line-height: 1.55; color: var(--ink2); }
  .foot { left: 96px; top: 842px; font-size: 17px; color: var(--ink2); }
  .foot b { color: var(--ink); font-family: var(--f-num); }

  #tip { position: fixed; z-index: 10; pointer-events: none; background: #fff; color: var(--ink); border-radius: 12px; padding: 10px 14px;
    font-size: 14px; line-height: 1.5; box-shadow: 0 10px 28px -10px rgba(36,49,63,.45); white-space: nowrap; }
  #tip b { font-family: var(--f-num); }
  #switch { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); display: flex; gap: 6px; font-size: 13px; }
  #switch a { color: var(--ink2); text-decoration: none; padding: 3px 10px; border-radius: 999px; background: rgba(255,255,255,.7); }
  #switch a[aria-current] { background: var(--ink); color: #fff; }
</style>
</head>
<body>
<div id="slide" role="region" aria-label="第 8 页 每一笔收入怎么分">
  <div class="kick">二 · 合作方式</div>
  <div class="no">08</div>
  <h1>每一笔收入怎么分</h1>
  <p class="sub">不论介绍人是谁，模块费、项目费每一单都<em class="mk">先抽 10%</em> 到数字化合作公司</p>

  <svg class="sticker" width="170" height="170" viewBox="0 0 170 170" aria-hidden="true">
    <circle cx="85" cy="88" r="72" fill="#fff" filter="drop-shadow(0 10px 14px rgba(36,49,63,.28))"/>
    <circle cx="85" cy="85" r="60" fill="#FFD37A"/>
    <circle cx="85" cy="85" r="47" fill="none" stroke="#E8A93A" stroke-width="5" stroke-dasharray="2 9" stroke-linecap="round"/>
    <text x="85" y="98" text-anchor="middle" font-family="Bahnschrift, Arial, sans-serif" font-weight="700" font-size="38" fill="#24313F">10%</text>
  </svg>

  <div class="card chartcard">
    <div class="head">
      <div class="legend" aria-hidden="true">
        <span><i style="background:var(--p0)"></i>数字化合作公司</span>
        <span><i style="background:var(--p1)"></i>技术方</span>
        <span><i style="background:var(--p2)"></i>介绍人</span>
      </div>
      <button class="tbtn" type="button" aria-pressed="false">看表格</button>
    </div>
    <div class="chart"></div>
    <div class="tview" hidden></div>
  </div>

  <div class="card mini m1">
    <h3>年维护费</h3>
    <p>不抽，100% 付给技术方，用于持续的维护人力与服务器</p>
  </div>
  <div class="card mini m2">
    <h3>驻厂工程师课</h3>
    <p>线下实践课先扣材料、学员意外险等直接成本，再抽 10%，余下技术方与示范工厂各 50%；线上课由技术方的公司直接收</p>
  </div>
  <div class="foot">例：其他销售介绍一单 10 万元，技术方 <b>7</b> 万、介绍人 <b>1.35</b> 万、数字化合作公司 <b>1.65</b> 万</div>
</div>
<div id="tip" hidden></div>
<nav id="switch" aria-label="切换样式"><a href="style-a.html" aria-current="page">样式 A</a><a href="style-b.html">样式 B</a><a href="style-c.html">样式 C</a></nav>

<script>
/* 内容与另两份样页逐字相同；数字取自合作方案草案 v15 第二节第 6 项 */
const PARTS = ["数字化合作公司", "技术方", "介绍人"];
const GROUPS = [
  { item: "模块费、降本增效项目费", rows: [
    { who: "销售合伙人介绍", v: [10, 63, 27] },
    { who: "其他销售介绍", v: [16.5, 70, 13.5] } ] },
  { item: "实施人天费、变更单", rows: [
    { who: "销售合伙人介绍", v: [0, 70, 30] },
    { who: "其他销售介绍", v: [15, 70, 15] } ] }
];
const pct = n => (Math.round(n * 10) / 10) + "%";
const wan = n => (Math.round(n * 100) / 1000) + " 万元";   // 一单 10 万元时的金额

function render(root) {
  const chart = root.querySelector(".chart"), tview = root.querySelector(".tview");
  let h = "", t = "<table><thead><tr><th>收入</th><th>介绍人是谁</th>" + PARTS.map(p => `<th class="r">${p}</th>`).join("") + "</tr></thead><tbody>";
  GROUPS.forEach((g, gi) => {
    if (gi) h += '<div class="gsp"></div>';
    h += `<p class="grp">${g.item}</p>`;
    g.rows.forEach(r => {
      const name = `${g.item}，${r.who}：` + r.v.map((x, i) => `${PARTS[i]} ${pct(x)}`).join("，");
      h += `<div class="row"><span class="who">${r.who}</span><div class="bar" role="img" aria-label="${name}">`;
      r.v.forEach((x, i) => { if (x > 0) h += `<span class="seg p${i}" style="--v:${x}" tabindex="0" data-tip="${PARTS[i]}|${g.item}，${r.who}|${x}">${pct(x)}</span>`; });
      h += "</div></div>";
      t += `<tr><td>${g.item}</td><td>${r.who}</td>` + r.v.map(x => `<td class="r">${pct(x)}</td>`).join("") + "</tr>";
    });
  });
  chart.innerHTML = h;
  tview.innerHTML = t + "</tbody></table>";
  const btn = root.querySelector(".tbtn");
  btn.addEventListener("click", () => {
    const on = btn.getAttribute("aria-pressed") !== "true";
    btn.setAttribute("aria-pressed", on); btn.textContent = on ? "看图" : "看表格";
    chart.hidden = on; tview.hidden = !on;
  });
}

function tooltip() {
  const tip = document.getElementById("tip");
  const show = (el, x, y) => {
    const [p, ctx, v] = el.dataset.tip.split("|");
    tip.innerHTML = `${ctx}<br>${p}：整单 <b>${pct(+v)}</b><br>一单 10 万元时 <b>${wan(+v)}</b>`;
    tip.hidden = false;
    const w = tip.offsetWidth, hh = tip.offsetHeight;
    tip.style.left = Math.min(x + 14, innerWidth - w - 8) + "px";
    tip.style.top = Math.max(8, y - hh - 14) + "px";
  };
  document.addEventListener("pointermove", e => { const s = e.target.closest(".seg"); s ? show(s, e.clientX, e.clientY) : (tip.hidden = true); });
  document.addEventListener("focusin", e => { const s = e.target.closest(".seg"); if (s) { const r = s.getBoundingClientRect(); show(s, r.left, r.top); } });
  document.addEventListener("focusout", () => { tip.hidden = true; });
}

function fit() {
  const s = document.getElementById("slide");
  const k = Math.min((innerWidth - 48) / 1600, (innerHeight - 72) / 900);
  s.style.transform = `translate(${(innerWidth - 1600 * k) / 2}px, 24px) scale(${k})`;
}
render(document.getElementById("slide")); tooltip(); fit();
addEventListener("resize", fit);
</script>
</body>
</html>
