<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>企业信息面板 — 华东弹簧</title>
  <script>try { document.documentElement.dataset.theme = localStorage.getItem("board-theme") || "light"; } catch (e) { document.documentElement.dataset.theme = "light"; }</script>
  <style>
    :root {
      --bg: #fafaf9; --fg: #1c1b1a; --muted: #6b6964; --border: #e6e4e0;
      --accent: #c96442; --surface: #ffffff; --good: #2f7d4a; --bad: #b53a2a;
      --shadow: rgba(28,27,26,0.10); --scrim: rgba(28,27,26,0.28);
    }
    [data-theme="dark"] {
      --bg: #161514; --fg: #ecebe8; --muted: #9c9992; --border: #2f2d2a;
      --accent: #d97757; --surface: #1f1e1c; --good: #5fb37c; --bad: #e2634f;
      --shadow: rgba(0,0,0,0.45); --scrim: rgba(0,0,0,0.5);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 -apple-system, system-ui, sans-serif; display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
    .sidebar { background: var(--surface); border-right: 1px solid var(--border); padding: 16px; position: sticky; top: 0; height: 100vh; }
    .brand { font-weight: 600; padding: 8px 10px 18px; }
    .nav { display: flex; flex-direction: column; gap: 2px; }
    .nav a { padding: 7px 10px; border-radius: 6px; color: var(--fg); text-decoration: none; }
    .nav a.active { background: var(--bg); font-weight: 500; }
    .nav a:hover { background: var(--bg); }
    main { padding: 0 28px 56px; min-width: 0; }
    .topbar { padding: 16px 0; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
    .topbar h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
    .topbar .right { display: flex; align-items: center; gap: 12px; color: var(--muted); }
    .clock { font-variant-numeric: tabular-nums; }
    button, .btn { font: inherit; cursor: pointer; padding: 7px 13px; border-radius: 6px; text-decoration: none; display: inline-block; }
    .btn-primary { background: var(--accent); color: white; border: 1px solid var(--accent); }
    .btn-secondary { background: transparent; color: var(--fg); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--bg); }
    .btn-sm { padding: 4px 10px; font-size: 12px; }

    .kpis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; margin-bottom: 28px; }
    @media (max-width: 1280px) { .kpis { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 900px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
    .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; }
    .kpi.clickable { cursor: pointer; }
    .kpi.clickable:hover { border-color: var(--accent); }
    .kpi .label { font-size: 12px; color: var(--muted); letter-spacing: 0.05em; margin-bottom: 8px; }
    .kpi .value { font-size: 28px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
    .kpi .value small { font-size: 14px; color: var(--muted); margin-left: 3px; letter-spacing: 0; }
    .kpi .delta { font-size: 12px; margin-top: 4px; }
    .delta.up, .up { color: var(--good); }
    .delta.down, .down { color: var(--bad); }
    .delta.flat { color: var(--muted); }

    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 16px; min-width: 0; }
    .panel h3 { margin: 0 0 16px; font-size: 14px; font-weight: 500; }
    .panel-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .panel-head h3 { margin: 0; }
    .panel-head .note { margin-left: auto; font-size: 12px; color: var(--muted); }
    .panel-head .btn { margin-left: auto; }
    .sub-title { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
    .sub-title.next { margin-top: 20px; }
    .panels-row { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
    @media (max-width: 900px) { .panels-row { grid-template-columns: 1fr; } }

    .chart { height: 240px; background: linear-gradient(180deg, rgba(201,100,66,0.06), transparent); border-bottom: 1px solid var(--border); position: relative; overflow: hidden; }
    .chart svg { display: block; }
    .chart svg text { font-size: 11px; fill: var(--muted); }
    .chart svg text.strong { fill: var(--fg); }
    .chart svg .grid { stroke: var(--border); }
    .chart .guide { position: absolute; background: var(--fg); opacity: 0; pointer-events: none; transition: opacity .12s; }
    .tip { position: fixed; z-index: 40; pointer-events: none; background: var(--surface); color: var(--fg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 1.6; box-shadow: 0 6px 20px var(--shadow); max-width: 280px; }

    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 6px; border-top: 1px solid var(--border); }
    th { font-size: 11px; color: var(--muted); letter-spacing: 0.06em; font-weight: 500; }
    td.r, th.r { text-align: right; }
    .num { font-variant-numeric: tabular-nums; }
    table.clickable tbody tr { cursor: pointer; }
    table.clickable tbody tr:hover { background: var(--bg); }
    .table-wrap { overflow-x: auto; }
    .muted { color: var(--muted); }
    .bad-text { color: var(--bad); }
    .pill { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--border); white-space: nowrap; }
    .pill.good { color: var(--good); border-color: rgba(47,125,74,0.3); }
    .pill.bad { color: var(--bad); border-color: rgba(181,58,42,0.3); }
    .pill.warn { color: var(--accent); border-color: rgba(201,100,66,0.35); }
    .pill b { margin-left: 4px; font-weight: 600; }
    .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .link { color: var(--accent); cursor: pointer; text-decoration: none; }
    .link:hover { text-decoration: underline; }

    /* 工位负荷 */
    .ws-row { display: grid; grid-template-columns: 84px minmax(0, 1fr) 48px 64px; grid-template-rows: auto auto; column-gap: 12px; align-items: center; padding: 7px 10px; border-radius: 6px; cursor: pointer; }
    .ws-row:hover, .ws-row:focus-visible { background: var(--bg); outline: none; }
    .ws-row .name { font-weight: 500; }
    .ws-row .pct { text-align: right; font-variant-numeric: tabular-nums; }
    .ws-row .sub { grid-column: 2 / 5; font-size: 12px; color: var(--muted); display: flex; gap: 8px; min-width: 0; }
    .ws-row .sub .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ws-row .sub .d { margin-left: auto; flex: none; font-variant-numeric: tabular-nums; }
    .bar { position: relative; height: 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--border); }
    .bar > i { position: absolute; left: 0; top: -1px; bottom: -1px; width: var(--v); border-radius: inherit; background: var(--c, var(--good)); }
    .bar > b { position: absolute; top: -4px; bottom: -4px; border-left: 1.5px dashed var(--bad); }
    .bar.good { --c: var(--good); } .bar.warn { --c: var(--accent); } .bar.bad { --c: var(--bad); } .bar.idle { --c: var(--muted); }

    /* 缺料与预警、钢丝 */
    .alert-item { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--border); }
    .alert-item:first-child { border-top: 0; padding-top: 0; }
    .alert-item .pill { flex: none; margin-top: 1px; }
    .wire { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 8px; padding: 8px 0; border-top: 1px solid var(--border); }
    .wire > span:first-child { white-space: nowrap; }
    .wire .val { color: var(--muted); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
    .wire .bar { grid-column: 1 / 3; }

    .bridge-note { margin: 0 0 12px; color: var(--muted); }
    .bridge-note b { color: var(--fg); font-weight: 500; }
    .bridge-note b.bad-text { color: var(--bad); }
    .caption { font-size: 12px; color: var(--muted); margin-top: 8px; }

    /* 右侧详情 */
    .scrim { position: fixed; inset: 0; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
    .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100vw); z-index: 21; background: var(--surface); border-left: 1px solid var(--border); box-shadow: -12px 0 32px var(--shadow); transform: translateX(105%); transition: transform .24s ease; display: flex; flex-direction: column; }
    body.drawer-open .scrim { opacity: 1; pointer-events: auto; }
    body.drawer-open .drawer { transform: none; }
    .drawer-head { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--border); }
    .drawer-head h2 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
    .drawer-head button { margin-left: auto; }
    .drawer-body { overflow-y: auto; padding: 20px 20px 40px; flex: 1; }
    .drawer-body h3 { margin: 24px 0 12px; font-size: 14px; font-weight: 500; }
    .drawer .chart { height: 220px; }
    .drawer th, .drawer td { white-space: nowrap; }
    .meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--muted); margin: 0; }
    .meta .btn { margin-left: auto; }
    .facts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 16px 0 8px; }
    @media (max-width: 600px) { .facts { grid-template-columns: repeat(2, 1fr); } }
    .facts > div { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
    .facts .k { color: var(--muted); font-size: 12px; }
    .facts .v { font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .drawer .alert-item:first-child { border-top: 1px solid var(--border); padding-top: 8px; }
  </style>
</head>

  <aside class="sidebar" data-od-id="sidebar">
    <div class="brand">◐ 华东弹簧</div>
    <nav class="nav">
      <a href="#" class="active">企业信息面板</a>
      <a href="#load">工位负荷</a>
      <a href="#alerts">缺料与预警</a>
      <a href="#risk">交期风险</a>

  <main>

      </div>
    </div>

    <div class="kpis" id="kpis" data-od-id="kpis"></div>

      <section class="panel" id="load" data-od-id="load-panel">
        <div class="panel-head"><h3>工位负荷</h3><span class="note">条长按 130% 封顶，红虚线为 100% · 点设备看详情</span></div>
        <div id="ws-list"></div>
      </section>
      <section class="panel" id="alerts" data-od-id="alerts-panel">
        <div class="panel-head"><h3>缺料与预警</h3><span class="note" id="alert-count"></span></div>
        <div id="alert-list"></div>

    <section class="panel" id="risk" data-od-id="risk-panel">

      <div class="pills" id="wip-pills"></div>
      <div class="table-wrap"><table class="clickable" id="risk-table"></table></div>
    </section>

    <div class="panels-row" id="quality">
      <section class="panel" data-od-id="spc-panel">
        <div class="panel-head"><h3 id="spc-title"></h3><span class="note" id="spc-note"></span></div>
        <div class="chart" id="ch-spc"></div>
        <div class="caption" id="spc-caption"></div>
      </section>
      <section class="panel" data-od-id="defect-panel">
        <div class="panel-head"><h3>近 12 个月不良率</h3></div>
        <div class="chart" id="ch-defect"></div>
        <div class="caption" id="defect-caption"></div>
      </section>
    </div>

    <section class="panel" id="margin" data-od-id="margin-panel">
      <div class="panel-head"><h3>毛利漏在哪</h3><span class="note" id="bridge-month"></span></div>
      <p class="bridge-note" id="bridge-note"></p>
      <div class="chart" id="ch-bridge"></div>
    </section>
  </main>

  <div class="scrim" onclick="closeDrawer()"></div>
  <aside class="drawer" aria-hidden="true">
    <div class="drawer-head"><h2 id="dr-title"></h2><span id="dr-badge"></span><button class="btn-secondary" onclick="closeDrawer()">关闭</button></div>
    <div class="drawer-body">
      <div id="dr-top"></div>
      <div id="dr-chart-box"><h3 id="dr-chart-title"></h3><div class="chart" id="dr-chart"></div></div>
      <div id="dr-bottom"></div>
    </div>
  </aside>
  <div class="tip" id="tip" hidden></div>

  ["准时交付率", Math.round(k.onTimeRate * 100), "%", otDelta >= 0 ? "up" : "down", `较上月 ${otDelta >= 0 ? "+" : "−"}${Math.round(Math.abs(otDelta) * 100)} 个点`],
].map(([l, v, u, cls, delta, click]) => `<div class="kpi${click ? " clickable" : ""}"${click ? ` onclick="${click}"` : ""}>
  <div class="label">${l}</div><div class="value">${v}<small>${u}</small></div><div class="delta ${cls}">${delta}</div></div>`).join("");

// ---------- 工位负荷 ----------
$("ws-list").innerHTML = D.workstations.map((w) => {
  const now = w.current ? `在做 ${w.current.workOrder.slice(-5)} ${w.current.op}` : (D.statusNote[w.id] || "");
  return `<div class="ws-row" tabindex="0" role="button" onclick="openWs('${w.id}')" onkeydown="if(event.key==='Enter')openWs('${w.id}')">
    <span class="name">${w.id}</span>
    <div class="bar ${loadCls(w)}"><i style="--v: ${Math.min(w.load / 1.3, 1) * 100}%"></i><b style="left: ${100 / 1.3}%"></b></div>
    <span class="pct ${w.load > 1 ? "bad-text" : ""}">${Math.round(w.load * 100)}%</span>
    <span>${stPill(w.status)}</span>
    <div class="sub"><span class="t">${now}</span><span class="d">排到 ${w.freeDate.slice(5)}</span></div>
  </div>`;
}).join("");

// ---------- 缺料与预警、钢丝 ----------
$("alert-count").textContent = k.alerts.length + " 条";
const levelPill = { alarm: pill("bad", "严重"), over: pill("bad", "负荷"), wait: pill("warn", "提醒") };
$("alert-list").innerHTML = k.alerts.map((a) => {
  const ws = D.workstations.find((w) => a.text.startsWith(w.id));
  const wo = D.workOrders.find((w) => a.text.startsWith(w.salesOrder));
  const click = ws ? ` class="link" onclick="openWs('${ws.id}')"` : wo ? ` class="link" onclick="openWo('${wo.id}')"` : "";
  return `<div class="alert-item">${levelPill[a.level]}<span${click}>${a.text}</span></div>`;
}).join("");
$("wires").innerHTML = D.materials.map((m) => {
  const cls = m.belowSafety ? "bad" : m.suggestQty ? "warn" : "good";
  return `<div class="wire"><span>${m.name}</span>
    <span class="val" title="${m.arrival ? "在途 " + num(m.onOrder) + " 千克，" + m.arrival + " 到货" : "无在途"}">${num(m.stock)} 千克 · <span class="${m.belowSafety ? "bad-text" : ""}">${m.coverDays.toFixed(1)} 天</span>${m.arrival ? " · " + m.arrival.slice(5) + " 到货" : m.suggestQty ? " · 建议补 " + num(m.suggestQty) + " 千克" : ""}</span>
    <div class="bar ${cls}"><i style="--v: ${Math.min(m.stock / m.rop, 1) * 100}%"></i><b style="left: ${(m.safety / m.rop) * 100}%"></b></div></div>`;
}).join("");

// ---------- 交期风险单 ----------
$("wip-btn").textContent = `全部在制 ${k.wipOrders} 张`;
$("wip-pills").innerHTML = k.wipByOp.map((x) => `<span class="pill">${x.op}<b>${x.count}</b></span>`).join("") +
  `<span class="pill warn">偏紧<b>${k.riskOrders - k.lateOrders}</b></span><span class="pill bad">延误<b>${k.lateOrders}</b></span>`;
const risky = D.workOrders.filter((w) => w.risk !== "ok").sort((a, b) => a.slackDays - b.slackDays);
$("risk-table").innerHTML = `<thead><tr><th>销售订单</th><th>客户</th><th>产品</th><th>交期</th><th>预计完工</th><th>当前工序</th><th>风险</th></tr></thead><tbody>` +
  risky.map((w) => `<tr onclick="openWo('${w.id}')"><td class="num">${w.salesOrder.slice(-5)}</td><td>${w.customer}</td><td>${P(w.product)}</td>
    <td class="num">${w.delivery.slice(5)}</td><td class="num ${w.risk === "late" ? "bad-text" : ""}">${w.finishDate.slice(5)}</td><td>${w.currentOp}</td>
    <td>${w.risk === "late" ? pill("bad", "晚 " + -w.slackDays + " 天") : pill("warn", "当天完工")}</td></tr>`).join("") + "</tbody>";

// ---------- 质量、毛利文字 ----------
$("spc-title").textContent = `质量 · ${spc.workstation} ${spc.param} X̄ 控制图`;
$("spc-note").textContent = `Cpk ${spc.cpk.toFixed(2)} · ${spc.violations.length} 组判异`;
$("spc-caption").innerHTML = `${P(spc.item)}，规格 ${spc.lsl}～${spc.usl} mm。<span class="bad-text">第 ${spc.violations[0]}～${spc.violations[spc.violations.length - 1]} 组连续在中心线上方</span>，判异。`;
const maxM = D.monthly.reduce((a, b) => (b.defectRate > a.defectRate ? b : a));
$("defect-caption").textContent = `最高 ${+maxM.month.slice(5)} 月 ${(maxM.defectRate * 100).toFixed(1)}%，本月 ${(last.defectRate * 100).toFixed(1)}%`;
$("bridge-month").textContent = mb.month.replace("-", " 年 ") + " 月";
$("bridge-note").innerHTML = `销售额 <b>${wan(mb.revenue)}</b>，按标准成本应赚 <b>${wan(mb.standardProfit)}</b>（${(mb.standard * 100).toFixed(1)}%），实际赚 <b>${wan(mb.actualProfit)}</b>（${(mb.actual * 100).toFixed(1)}%），少了 <b class="bad-text">${wan(mb.gap)}</b>。悬停柱子看原因。`;
</script>
<script>
// ---------- 图表：原生 SVG，按容器实际尺寸画，颜色取 CSS 变量（切换深浅不用重画） ----------
const tip = $("tip");
function chart(el, spec) {
  const c = {};
  const paint = () => {
    const w = el.clientWidth, h = el.clientHeight; if (!w || !h) return;
    const [l, r, t, b] = spec.pad(w);
    const g = { w, h, l, r, t, b, n: spec.n, cw: w - l - r, ch: h - t - b };
    g.step = g.cw / g.n; g.X = (i) => l + (i + 0.5) * g.step; c.g = g;
    el.innerHTML = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${spec.svg(g)}</svg><i class="guide"></i>`;
  };
  new ResizeObserver(paint).observe(el);
  el.addEventListener("mousemove", (e) => {
    const g = c.g; if (!g) return;
    const rect = el.getBoundingClientRect(), i = Math.floor((e.clientX - rect.left - g.l) / g.step), guide = el.querySelector(".guide");
    if (i < 0 || i >= g.n) { tip.hidden = true; guide.style.opacity = 0; return; }
    guide.style.cssText = `opacity:.06; left:${g.l + i * g.step}px; width:${g.step}px; top:${g.t}px; height:${g.ch}px`;
    tip.innerHTML = spec.tip(i); tip.hidden = false;
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    tip.style.left = Math.min(e.clientX + 14, innerWidth - tw - 8) + "px";
    tip.style.top = Math.min(e.clientY + 14, innerHeight - th - 8) + "px";
  });
  el.addEventListener("mouseleave", () => { tip.hidden = true; const gd = el.querySelector(".guide"); if (gd) gd.style.opacity = 0; });
}
const hline = (g, y) => `<line class="grid" x1="${g.l}" x2="${g.w - g.r}" y1="${y}" y2="${y}"/>`;

// SPC X̄ 图：控制线、判异区、判异点标红
function spcSpec(compact) {
  const yMin = 49.7, yMax = 50.3;
  return {
    n: spc.groups.length, pad: () => [44, compact ? 40 : 92, 12, 24],
    svg(g) {
      const Y = (v) => g.t + ((yMax - v) / (yMax - yMin)) * g.ch;
      let s = "";
      for (let i = 0; i <= 6; i++) { const v = yMin + i * 0.1; s += hline(g, Y(v)) + `<text x="${g.l - 6}" y="${Y(v) + 4}" text-anchor="end">${v.toFixed(1)}</text>`; }
      const vs = spc.violations;
      if (vs.length) { const x0 = g.l + (vs[0] - 1) * g.step, x1 = g.l + vs[vs.length - 1] * g.step; s += `<rect x="${x0}" y="${g.t}" width="${x1 - x0}" height="${g.ch}" style="fill:var(--bad);opacity:.08"/>`; }
      [["UCL", spc.xbar.ucl, "bad", true], ["CL", spc.xbar.cl, "muted", false], ["LCL", spc.xbar.lcl, "bad", true]].forEach(([nm, v, c, dash]) => {
        const y = Y(v);
        s += `<line x1="${g.l}" x2="${g.w - g.r}" y1="${y}" y2="${y}" style="stroke:var(--${c})"${dash ? ' stroke-dasharray="4 4"' : ""}/>` +
          `<text x="${g.w - g.r + 6}" y="${y + 4}">${compact ? nm : nm + " " + v.toFixed(3)}</text>`;
      });
      spc.groups.forEach(([no], i) => { if (i % 4 === 0) s += `<text x="${g.X(i)}" y="${g.h - 6}" text-anchor="middle">${no}</text>`; });
      s += `<polyline fill="none" style="stroke:var(--accent)" stroke-width="2" stroke-linejoin="round" points="${spc.groups.map(([, m], i) => g.X(i) + "," + Y(m)).join(" ")}"/>`;
      spc.groups.forEach(([, m, f], i) => { s += `<circle cx="${g.X(i)}" cy="${Y(m)}" r="${compact ? 3.5 : 4.5}" style="fill:var(--${f ? "bad" : "accent"});stroke:var(--surface)" stroke-width="1.5"/>`; });
      return s;
    },
    tip: (i) => { const [no, m, f] = spc.groups[i]; return `第 ${no} 组<br>子组均值 <b>${m.toFixed(3)}</b> mm${f ? `<br><span class="bad-text">判异：连续在中心线同侧</span>` : ""}`; },
  };
}
chart($("ch-spc"), spcSpec(true));

// 近 12 个月不良率：面积折线，最高点标红
chart($("ch-defect"), {
  n: D.monthly.length, pad: () => [36, 10, 22, 24],
  svg(g) {
    const ms = D.monthly, Y = (v) => g.t + (1 - v / 0.03) * g.ch;
    let s = `<defs><linearGradient id="gd-defect" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.28"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient></defs>`;
    for (let i = 0; i <= 3; i++) s += hline(g, Y(i / 100)) + `<text x="${g.l - 6}" y="${Y(i / 100) + 4}" text-anchor="end">${i}%</text>`;
    ms.forEach((m, i) => { if (i % 3 === 0) s += `<text x="${g.X(i)}" y="${g.h - 6}" text-anchor="middle">${+m.month.slice(5)}月</text>`; });
    const pts2 = ms.map((m, i) => [g.X(i), Y(m.defectRate)]);
    s += `<path d="M${pts2.map((p) => p.join(",")).join(" L")} L${pts2[pts2.length - 1][0]},${Y(0)} L${pts2[0][0]},${Y(0)} Z" fill="url(#gd-defect)"/>`;
    s += `<polyline fill="none" style="stroke:var(--accent)" stroke-width="2" stroke-linejoin="round" points="${pts2.map((p) => p.join(",")).join(" ")}"/>`;
    const mi = ms.indexOf(maxM);
    pts2.forEach(([x, y], i) => { s += `<circle cx="${x}" cy="${y}" r="${i === mi ? 5 : 3}" style="fill:var(--${i === mi ? "bad" : "accent"});stroke:var(--surface)" stroke-width="1.5"/>`; });
    s += `<text class="strong" x="${pts2[mi][0]}" y="${pts2[mi][1] - 10}" text-anchor="middle">${(maxM.defectRate * 100).toFixed(1)}%</text>`;
    return s;
  },
  tip: (i) => { const m = D.monthly[i]; return `${m.month.replace("-", " 年 ")} 月<br>不良率 <b>${(m.defectRate * 100).toFixed(1)}%</b>`; },
});

// 毛利瀑布：首尾是标准毛利与实际毛利，中间四项从上往下扣
const bridgeCats = ["标准毛利", ...mb.items.map((x) => x.name), "实际毛利"];
chart($("ch-bridge"), {
  n: bridgeCats.length, pad: () => [48, 12, 26, 42],
  svg(g) {
    const yMax = Math.ceil(mb.standardProfit / 50000) * 50000, Y = (v) => g.t + (1 - v / yMax) * g.ch, last = bridgeCats.length - 1;
    let s = "";
    for (let v = 0; v <= yMax; v += 50000) s += hline(g, Y(v)) + `<text x="${g.l - 6}" y="${Y(v) + 4}" text-anchor="end">${v / 10000}万</text>`;
    let top = mb.standardProfit; const bars = [[0, top]];
    mb.items.forEach((x) => { bars.push([top - x.amount, top]); top -= x.amount; });
    bars.push([0, mb.actualProfit]);
    const bw = Math.min(g.step * 0.52, 96);
    bars.forEach(([lo, hi], i) => {
      const x = g.X(i) - bw / 2, color = i === 0 ? "fg" : i === last ? "accent" : "bad";
      s += `<rect x="${x}" y="${Y(hi)}" width="${bw}" height="${Math.max(Y(lo) - Y(hi), 1)}" rx="4" style="fill:var(--${color});opacity:${i === 0 ? 0.72 : 1}"/>`;
      s += `<text class="strong" x="${g.X(i)}" y="${Y(hi) - 7}" text-anchor="middle">${i === 0 || i === last ? wan(hi - lo) : "−" + (mb.items[i - 1].points * 100).toFixed(1) + " 点"}</text>`;
      if (i < last) { const y = Y(i === 0 ? hi : lo); s += `<line x1="${x + bw}" x2="${g.X(i + 1) - bw / 2}" y1="${y}" y2="${y}" style="stroke:var(--muted)" stroke-dasharray="3 3"/>`; }
      const [a, b] = bridgeCats[i].includes("与") ? [bridgeCats[i].split("与")[0], "与" + bridgeCats[i].split("与")[1]] : [bridgeCats[i], ""];
      s += `<text x="${g.X(i)}" y="${g.h - 24}" text-anchor="middle">${a}</text>` + (b ? `<text x="${g.X(i)}" y="${g.h - 9}" text-anchor="middle">${b}</text>` : "");
    });
    return s;
  },
  tip: (i) => {
    const it = mb.items[i - 1];
    return it ? `${it.name}　<b class="bad-text">−${yuan(it.amount)}</b>（${pts(it.points)}）<br><span class="muted">${it.note}</span>`
      : `${bridgeCats[i]}　<b>${yuan(i === 0 ? mb.standardProfit : mb.actualProfit)}</b>（${((i === 0 ? mb.standard : mb.actual) * 100).toFixed(1)}%）`;
  },
});
</script>
<script>
// ---------- 右侧详情：设备、工单、全部在制 ----------
let drChart = false;
function showDrawer(withChart) {
  $("dr-chart-box").hidden = !withChart;
  document.body.classList.add("drawer-open"); document.querySelector(".drawer").setAttribute("aria-hidden", "false");
  document.querySelector(".drawer-body").scrollTop = 0;
  if (withChart && !drChart) { chart($("dr-chart"), spcSpec(false)); drChart = true; }
}
function closeDrawer() { document.body.classList.remove("drawer-open"); document.querySelector(".drawer").setAttribute("aria-hidden", "true"); tip.hidden = true; }
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });
const fact = (k2, v) => `<div><div class="k">${k2}</div><div class="v">${v}</div></div>`;
const wsLink = (id) => `<a class="link" onclick="openWs('${id}')">${id}</a>`;
const woLink = (id, t) => `<a class="link" onclick="openWo('${id}')">${t || id}</a>`;
const bottleneckOf = (w) => w.operations.filter((o) => o.remainMin > 0).reduce((a, b) => (b.end - b.start > a.end - a.start ? b : a), { end: 0, start: 0 });

function openWs(id) {
  const w = WS(id), note = D.statusNote[id];
  $("dr-title").textContent = id;
  $("dr-badge").innerHTML = stPill(w.status);
  const rows = D.workOrders.flatMap((x) => x.operations.filter((o) => o.workstation === id && o.remainMin > 0).map((o) => ({ w: x, o }))).sort((a, b) => a.o.start - b.o.start);
  $("dr-top").innerHTML = `<p class="meta">${w.zone} · 操作工 ${w.operator}${w.maxWireMm ? " · 最大线径 φ" + w.maxWireMm.toFixed(1) : ""}<button class="btn btn-secondary btn-sm">到车间看</button></p>
    <div class="facts">${fact("未来 6 天负荷", `<span class="${w.load > 1 ? "bad-text" : ""}">${Math.round(w.load * 100)}%</span>`)}${fact("排队工时", hours(w.backlogMin))}
      ${fact("排到哪天", w.freeDate)}${fact("正在做", w.current ? w.current.workOrder.slice(-5) + " " + w.current.op : "—")}</div>
    ${note ? `<div class="alert-item">${stPill(w.status)}<span>${note}</span></div>` : ""}
    ${w.load > 1 ? `<div class="alert-item">${pill("bad", "负荷")}<span>未来 6 个工作日排了 ${hours(w.backlogMin)}，超出可用工时 ${Math.round((w.load - 1) * 100)}%</span></div>` : ""}`;
  $("dr-chart-title").textContent = `SPC 控制图 · ${P(spc.item)} ${spc.param}（规格 ${spc.lsl}～${spc.usl} mm）`;
  $("dr-bottom").innerHTML = `<h3>排在这台设备上的工序</h3>` + (rows.length ? `<div class="table-wrap"><table><thead><tr><th>工单</th><th>客户</th><th>产品</th><th>工序</th>
      <th class="r">剩余工时</th><th>开工</th><th>完工</th><th>交期</th></tr></thead><tbody>` +
    rows.map(({ w: x, o }) => `<tr><td class="num">${woLink(x.id, x.id.slice(-5))}</td><td>${x.customer}</td><td>${P(x.product)}</td><td>${o.op}${o.done > 0 ? ` <span class="muted">${Math.round(o.done * 100)}%</span>` : ""}</td>
      <td class="r num">${hours(o.remainMin)}</td><td class="num">${o.startDate.slice(5)}</td><td class="num">${o.endDate.slice(5)}</td><td>${riskPill[x.risk]}</td></tr>`).join("") +
    "</tbody></table></div>" : `<p class="muted">没有排队的工序</p>`);
  showDrawer(id === spc.workstation);
}

function openWo(id) {
  const w = woById[id], bn = bottleneckOf(w);
  $("dr-title").textContent = w.customer + " · " + P(w.product);
  $("dr-badge").innerHTML = riskPill[w.risk];
  $("dr-top").innerHTML = `<p class="meta">${w.id} · 销售订单 ${w.salesOrder}</p>
    <div class="facts">${fact("订单数量", num(D.soQty[w.salesOrder]) + " 支")}${fact("计划投产", num(w.plannedQty) + " 支")}${fact("交期", w.delivery)}
      ${fact("预计完工", `<span class="${w.risk === "late" ? "bad-text" : ""}">${w.finishDate}</span>`)}</div>
    ${w.risk === "late" ? `<div class="alert-item">${pill("bad", "延误")}<span>比交期晚 ${-w.slackDays} 个工作日；最耗时的是 ${bn.op}（${wsLink(bn.workstation)}）</span></div>` : ""}
    ${w.risk === "tight" ? `<div class="alert-item">${pill("warn", "偏紧")}<span>交期当天完工，没有余量</span></div>` : ""}
    ${w.materialNote ? `<div class="alert-item">${pill("warn", "钢丝")}<span>${w.materialNote}</span></div>` : ""}`;
  $("dr-bottom").innerHTML = `<h3>各工序进度与排程</h3><div class="table-wrap"><table><thead><tr><th>工序</th><th>设备</th><th>完成</th>
      <th class="r">良品（支）</th><th class="r">剩余工时</th><th>开工</th><th>完工</th></tr></thead><tbody>` +
    w.operations.map((o) => `<tr><td>${o.op}</td><td>${wsLink(o.workstation)}</td>
      <td><div class="bar ${o.done >= 1 ? "good" : "warn"}" style="min-width: 80px"><i style="--v: ${o.done * 100}%"></i></div></td>
      <td class="r num">${num(o.goodQty)}</td><td class="r num">${o.remainMin ? hours(o.remainMin) : "—"}</td>
      <td class="num">${o.startDate ? o.startDate.slice(5) : "—"}</td><td class="num">${o.endDate ? o.endDate.slice(5) : "已完成"}</td></tr>`).join("") + "</tbody></table></div>";
  showDrawer(false);
}

function openWipList() {
  $("dr-title").textContent = "全部在制工单";
  $("dr-badge").innerHTML = pill("", k.wipOrders + " 张");
  $("dr-top").innerHTML = `<div class="pills">${k.wipByOp.map((x) => `<span class="pill">当前在${x.op}<b>${x.count}</b></span>`).join("")}</div>`;
  $("dr-bottom").innerHTML = `<div class="table-wrap"><table class="clickable"><thead><tr><th>工单</th><th>客户</th><th>产品</th><th class="r">计划（支）</th><th>当前工序</th><th>交期</th><th>预计完工</th><th>风险</th></tr></thead><tbody>` +
    D.workOrders.slice().sort((a, b) => a.delivery.localeCompare(b.delivery)).map((w) => `<tr onclick="openWo('${w.id}')"><td class="num">${w.id.slice(-5)}</td><td>${w.customer}</td><td>${P(w.product)}</td>
      <td class="r num">${num(w.plannedQty)}</td><td>${w.currentOp}</td><td class="num">${w.delivery.slice(5)}</td><td class="num">${w.finishDate.slice(5)}</td><td>${riskPill[w.risk]}</td></tr>`).join("") + "</tbody></table></div>";
  showDrawer(false);
}
</script>
