# ERX-001 开发环境
#
# 数据库/Redis 用 named volume（性能），bench 代码用 bind mount（可改、可拷走）。
# 换机器后用 scripts/setup.sh 重建环境，用 scripts/restore.sh 恢复数据。
# 详见 docker/README.md。

name: erx001

services:
  mariadb:
    image: docker.io/mariadb:11.8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-123}"
      MARIADB_AUTO_UPGRADE: 1
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis-cache:
    image: docker.io/redis:alpine
    volumes:
      - redis-cache-data:/data
    restart: unless-stopped

  redis-queue:
    image: docker.io/redis:alpine
    volumes:
      - redis-queue-data:/data
    restart: unless-stopped

  frappe:
    image: docker.io/frappe/bench:latest
    command: sleep infinity
    environment:
      - SHELL=/bin/bash
    working_dir: /workspace/frappe-bench
    volumes:
      # 项目根挂进容器：bench、docker 脚本、docs 都在里面
      - ..:/workspace:cached
    ports:
      # 宿主侧 socketio 用 9100——9000 落在 Windows 保留段（实测 netsh 排除范围含
      # 8995-9094），宿主绑不上。容器内也监听 9100（由站点配置 socketio_port 决定），
      # 故两侧同号直通：浏览器按站点配置里的端口去连宿主，同号才连得上。
      # 改这里必须同步改 sites/common_site_config.json 的 socketio_port，否则
      # realtime 静默断连（P1-S2-R1 第 15 步实测踩过）。
      - "${WEB_PORT:-8000}:8000"        # Frappe web
      - "${SOCKETIO_PORT:-9100}:9100"   # realtime
      - "${WATCH_PORT:-6787}:6787"      # asset watcher
    depends_on:
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started
    restart: unless-stopped

volumes:
  mariadb-data:
  redis-cache-data:
  redis-queue-data:
